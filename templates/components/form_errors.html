{% if form.errors %}
<div class="error-summary" role="alert" tabindex="-1" data-error-summary>
  <h2>Birlikte düzeltelim.</h2>
  <p>Aşağıdaki alanları kontrol et:</p>
  {{ form.non_field_errors }}
  <ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ field.errors|join:" " }}</a></li>{% endif %}{% endfor %}</ul>
</div>
{% endif %}
